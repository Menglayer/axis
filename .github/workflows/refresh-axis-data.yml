name: Refresh AXIS data

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Fetch official AXIS snapshot
        id: fetch
        continue-on-error: true
        run: npm run refresh:data

      - name: Commit refreshed snapshot
        if: steps.fetch.outcome == 'success'
        run: |
          if git diff --quiet -- public/data/axis-stats.json; then
            echo "AXIS snapshot is unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/axis-stats.json
          git commit -m "chore: refresh AXIS points snapshot"
          git push
